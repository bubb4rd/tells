<!doctype html>
<!-- Hero specimen, variant 1: default output, tells on purpose. Lands on cluster-glow-void. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repair desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=block">
<style>
  :root { --bg: #0b0a14; --violet: #7c3aed; --text: #fafafa; --muted: #a1a1aa; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; overflow: hidden; position: relative; }
  .glow { position: absolute; width: 520px; height: 520px; right: -140px; top: -200px; border-radius: 50%; background: radial-gradient(circle, #8b5cf6, transparent 70%); filter: blur(80px); }
  .wrap { position: relative; padding: 56px 64px; max-width: 900px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #a78bfa; }
  h1 { margin: 18px 0 0; font-size: 54px; line-height: 1.05; letter-spacing: -0.02em; }
  .grad { background: linear-gradient(90deg, #c4b5fd, #f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 18px 0 0; font-size: 18px; color: var(--muted); max-width: 520px; }
  .pill { display: inline-block; margin-top: 28px; padding: 13px 26px; border-radius: 999px; background: var(--violet); color: #fff; font-weight: 700; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 48px; }
  .card { padding: 20px; border-radius: 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); }
  .card b { display: block; font-size: 28px; }
  .card span { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="eyebrow">— Repair desk</div>
  <h1><span class="grad">Repairs,</span> <em class="grad">reimagined</em> ✨</h1>
  <p>Seamless, blazing-fast service for every rider, powered by smart workflows.</p>
  <span class="pill">Get started →</span>
  <div class="cards">
    <div class="card"><b>14</b><span>Bikes in</span></div>
    <div class="card"><b>5</b><span>Due today</span></div>
    <div class="card"><b>98%</b><span>On time</span></div>
  </div>
</div>
</body>
</html>
