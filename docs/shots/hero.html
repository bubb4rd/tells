<!doctype html>
<!--
  Source for docs/assets/hero.png. Render: node scripts/shots.mjs hero
  One brief, three builds, in hero/. Every note is a real hit:
    tells pick docs/shots/hero/*.html
  default.html     hand-written default output, tells on purpose
  taste-skill.html claude -p with Leonxlnx/taste-skill 2.5.1 (design-taste-frontend), Node 22, unedited
  built.html       hand-built to the rule set, then checked with tells
  `shots/` is skipped by `tells check .`.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="shot" content="1200x900@2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500&display=block">
<style>
  html, body { margin: 0; background: transparent; }
  .sheet { position: relative; width: 1200px; height: 900px; background: #f4f4f4; border-radius: 20px; overflow: hidden; color: #0a0a0a; }
  .label { position: absolute; font: 500 13px/1 "Source Code Pro", monospace; color: #6e6e6e; white-space: nowrap; }
  .label b { font-weight: 500; color: #0a0a0a; }
  .label i { font-style: normal; color: #c8321e; margin-left: 12px; }

  /* Screens drawn at a real viewport and scaled into their frames. */
  .screen { position: absolute; overflow: hidden; border: 1px solid #d4d4d4; border-radius: 8px; background: #fff; }
  .screen iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
  .thumb { left: 48px; width: 400px; height: 250px; }
  .thumb iframe { width: 1440px; height: 900px; transform: scale(0.27778); }
  .big { left: 488px; top: 104px; width: 1200px; height: 1200px; border-radius: 12px 0 0 0; }
  .big iframe { width: 880px; height: 900px; transform: scale(1.35); }

  .note { position: absolute; left: 48px; font: 500 12px/17px "Source Code Pro", monospace; color: #c8321e; white-space: nowrap; }
  .note span { display: inline-block; width: 56px; color: #6e6e6e; }
  .inner { position: absolute; left: 0; right: 0; top: 34px; bottom: 0; }
  svg.marks { position: absolute; inset: 0; width: 1200px; height: 900px; pointer-events: none; }
</style>
</head>
<body>
<div class="sheet" id="sheet">
<div class="inner">
  <div class="label" style="left:48px;top:34px"><b>brief</b> "a repair desk screen for a bike shop's staff"</div>

  <div class="label" style="left:48px;top:80px"><b>Default output</b></div>
  <div class="screen thumb" id="default" style="top:104px"><iframe src="hero/default.html" scrolling="no" title="Default output"></iframe></div>
  <div class="note" style="top:368px"><div><span>check</span>gradient-text, glass, +11</div><div><span>same</span>cluster-glow-void</div></div>

  <div class="label" style="left:48px;top:452px"><b>taste-skill</b></div>
  <div class="screen thumb" id="taste" style="top:476px"><iframe src="hero/taste-skill.html" scrolling="no" title="taste-skill"></iframe></div>
  <div class="note" style="top:740px"><div><span>check</span>side-tab</div><div><span>render</span>nested-cards, low-contrast</div></div>

  <div class="label" style="left:488px;top:80px"><b>Built with tells</b><i>0 rules broken</i></div>
  <div class="screen big" id="big"><iframe src="hero/built.html" scrolling="no" title="Built with tells"></iframe></div>
</div>
  <svg class="marks" id="marks" viewBox="0 0 1200 900"></svg>
</div>

<script>
  // Red pencil, drawn from the frames' real boxes.
  const RED = "#c8321e";
  let seed = 11;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const svg = document.getElementById("marks");

  const path = (d, width = 2.6) => {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    for (const [k, v] of Object.entries({ d, fill: "none", stroke: RED, "stroke-width": width, "stroke-linecap": "round", "stroke-linejoin": "round" })) p.setAttribute(k, v);
    svg.appendChild(p);
  };

  // Catmull-Rom through points, as cubic Béziers: a hand-drawn line with no corners.
  const smooth = (pts) => {
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1.map((v) => v.toFixed(1)).join(" ")} ${c2.map((v) => v.toFixed(1)).join(" ")} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return d;
  };

  const box = (id) => {
    const s = document.getElementById("sheet").getBoundingClientRect();
    const r = document.getElementById(id).getBoundingClientRect();
    return { left: r.left - s.left, right: r.right - s.left, top: r.top - s.top, bottom: r.bottom - s.top };
  };

  // One stroke through a rejected variant, corner to corner, a little past the frame.
  const strike = (b) => {
    const pts = [], n = 6;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      pts.push([b.left - 8 + (b.right - b.left + 16) * t + (rand() - 0.5) * 3, b.bottom + 6 - (b.bottom - b.top + 12) * t + Math.sin(t * Math.PI) * 6 + (rand() - 0.5) * 3]);
    }
    path(smooth(pts), 3);
  };

  window.addEventListener("load", () => {
    for (const id of ["default", "taste"]) strike(box(id));
  });
</script>
</body>
</html>
