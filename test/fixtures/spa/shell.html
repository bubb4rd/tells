<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shell</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/20px system-ui, sans-serif; color: #1d1b18; background: #f3f2ee; }
  /* An app shell: the page is one window tall, and the main panel scrolls inside it. */
  .app { display: grid; grid-template-columns: 200px minmax(0, 1fr); height: 100vh; }
  nav { border-right: 1px solid #c9c6bd; padding: 16px; }
  main { overflow-y: auto; padding: 24px; }
  section { height: 400px; border-bottom: 1px solid #c9c6bd; }
</style></head>
<body><div class="app"><nav aria-label="Main"><a href="#/a">Home</a></nav>
<main><h1>Home</h1><section></section><section></section><section></section><section><p>The last row.</p></section></main></div></body></html>
