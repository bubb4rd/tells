<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fade in</title>
<style>
  body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  h1 { font-size: 28px; }
  p { animation: in 6s ease-out; }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }
</style></head>
<body>
  <h1>Fade in</h1>
  <p>Dark text that fades in slowly. Once settled it passes contrast easily.</p>
</body>
</html>
