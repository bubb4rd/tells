<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nested-cards</title>
<style>
  body { margin: 0; padding: 32px; font: 16px/1.5 Georgia, serif; background: #f5f5f4; color: #111; }
  h1 { font-size: 32px; margin: 0 0 16px; }
  .outer { width: 520px; padding: 20px; background: #fff; border: 1px solid #d4d4d8; border-radius: 8px; }
  .inner { padding: 16px; background: #fafafa; border: 1px solid #e4e4e7; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Service docket</h1>
  <div class="outer">
    <div class="inner">
      <h2>Rear brake bleed</h2>
      <p>Scheduled for Thursday at 09:00 with Ama Mensah.</p>
    </div>
  </div>
</body>
</html>
