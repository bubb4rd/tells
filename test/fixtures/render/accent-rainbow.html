<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>accent-rainbow</title>
<style>
  body { margin: 0; padding: 32px; font: 16px/1.5 Georgia, serif; background: #fff; color: #111; }
  h1 { font-size: 32px; margin: 0 0 16px; }
  .tags { display: flex; gap: 10px; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 14px; font-weight: 600; }
  .b1 { background: #fee2e2; color: #991b1b; }
  .b2 { background: #fef3c7; color: #92400e; }
  .b3 { background: #dcfce7; color: #166534; }
  .b4 { background: #dbeafe; color: #1e40af; }
  .b5 { background: #fae8ff; color: #86198f; }
</style>
</head>
<body>
  <h1>Service categories</h1>
  <div class="tags">
    <span class="badge b1">Brakes</span>
    <span class="badge b2">Drivetrain</span>
    <span class="badge b3">Wheels</span>
    <span class="badge b4">Suspension</span>
    <span class="badge b5">Frame</span>
  </div>
</body>
</html>
