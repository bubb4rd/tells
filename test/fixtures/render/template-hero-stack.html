<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>template-hero-stack</title>
<style>
  body { margin: 0; padding: 48px 24px; font: 16px/1.5 Georgia, serif; background: #fff; color: #111; }
  .hero { max-width: 720px; margin: 0 auto; text-align: center; }
  .badge { display: inline-block; padding: 4px 12px; font-size: 12px; background: #f4f4f5; color: #3f3f46; border-radius: 6px; margin-bottom: 16px; }
  h1 { font-size: 48px; line-height: 1.1; margin: 0 0 16px; }
  .sub { font-size: 18px; color: #52525b; margin: 0 auto 24px; max-width: 520px; }
  .actions { display: flex; gap: 12px; justify-content: center; }
  .btn { display: inline-block; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; }
  .primary { background: #111; color: #fff; }
  .secondary { border: 1px solid #d4d4d8; color: #111; }
</style>
</head>
<body>
  <section class="hero">
    <span class="badge">Spring 2026 release</span>
    <h1>Workshop scheduling built for busy mechanics</h1>
    <p class="sub">Track every drop-off, parts order, and customer pickup without digging through clipboards.</p>
    <div class="actions">
      <a class="btn primary" href="#book">Book a slot</a>
      <a class="btn secondary" href="#tour">See pricing</a>
    </div>
  </section>
</body>
</html>
