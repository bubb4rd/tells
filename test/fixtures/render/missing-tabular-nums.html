<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>missing-tabular-nums</title>
<style>
  body { margin: 0; padding: 32px; font: 16px/1.5 Georgia, serif; background: #fff; color: #111; }
  h1 { font-size: 32px; margin: 0 0 16px; }
  table { border-collapse: collapse; width: 420px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e4e4e7; }
</style>
</head>
<body>
  <h1>Weekly revenue</h1>
  <table>
    <thead><tr><th>Day</th><th>Amount</th></tr></thead>
    <tbody>
      <tr><td>Monday</td><td>$1,110.00</td></tr>
      <tr><td>Tuesday</td><td>$898.50</td></tr>
      <tr><td>Wednesday</td><td>$2,415.25</td></tr>
    </tbody>
  </table>
</body>
</html>
